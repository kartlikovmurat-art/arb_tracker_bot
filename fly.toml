# Fly.io — деплой в один клик.
#
# Как использовать:
#   1. Установите flyctl: https://fly.io/docs/hydra/
#   2. fly auth signup  (или login, если уже есть аккаунт)
#   3. fly launch --copy-config --name arb-tracker
#      (--copy-config подхватит этот fly.toml).
#   4. fly secrets set BOT_TOKEN="ваш:токен"
#   5. fly deploy
#
# На бесплатном тарифе Fly даёт 3 shared VMs с 256 MB RAM.
# API и бот поднимаются как два отдельных процесса внутри одного
# приложения, чтобы не плодить аккаунты.

app = "arb-tracker"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHON_VERSION = "3.11"
  DATABASE_URL = "sqlite+aiosqlite:///./data/db.sqlite3"
  API_URL = "http://127.0.0.1:8000"

# Persistent volume — без него SQLite стирается при каждом деплое.
[[mounts]]
  source = "arb_data"
  destination = "/app/data"

# Внутри одной VM гоняем и API, и бота. healthcheck — за API.
[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  bot = "python run_bot.py"

[[services]]
  processes = ["api"]
  protocol = "tcp"
  internal_port = 8000
  auto_stop_machines = false   # чтобы бот не засыпал вместе с API
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

  [[services.http_checks]]
    interval = "60s"
    timeout = "10s"
    grace_period = "30s"
    method = "get"
    path = "/trades/"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
