; Supervisor configuration for arb_tracker_bot.
; Управляет: FastAPI (uvicorn), Telegram bot, watchdogs.
; Полная автономность: autorestart + внешний bash-watchdog + init.d.
;
; Все python процессы используют venv из /workspace/.venv/ — persistent,
; переживает ребут контейнера. /usr/bin/python3 НЕ работает (зависимости
; исчезают при ребуте).

[unix_http_server]
file=/workspace/supervisor/supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/workspace/supervisor/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200
childlogdir=/workspace/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/supervisor/supervisor.sock

; ════════════════════════════════════════════════════════════════════
;  Python venv — все программы используют его
; ════════════════════════════════════════════════════════════════════

[program:api]
; FastAPI-приложение.
command=/workspace/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --no-access-log
directory=/workspace/arb_tracker_bot1_full
environment=PYTHONUNBUFFERED="1",VIRTUAL_ENV="/workspace/.venv",PATH="/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
user=root
autostart=true
autorestart=true
startretries=10
startsecs=5
stopwaitsecs=15
stopsignal=TERM
killasgroup=true
stopasgroup=true
stdout_logfile=/workspace/logs/api.out.log
stderr_logfile=/workspace/logs/api.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_backups=5

[program:bot]
; Telegram bot. Запускается после API (priority=20).
command=/workspace/.venv/bin/python app/bot/bot.py
directory=/workspace/arb_tracker_bot1_full
environment=PYTHONUNBUFFERED="1",VIRTUAL_ENV="/workspace/.venv",PATH="/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
user=root
autostart=true
autorestart=true
startretries=10
startsecs=10
stopwaitsecs=15
stopsignal=TERM
killasgroup=true
stopasgroup=true
priority=20
stdout_logfile=/workspace/logs/bot.out.log
stderr_logfile=/workspace/logs/bot.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_backups=5

[program:watchdog]
; Каждые 5 минут пингует API, при падении перезапускает.
; SILENT MODE: алертит только после 3+ неудач подряд.
command=/workspace/.venv/bin/python /workspace/scripts/watchdog.py
directory=/workspace
environment=PYTHONUNBUFFERED="1",VIRTUAL_ENV="/workspace/.venv",PATH="/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
user=root
autostart=true
autorestart=true
startretries=999
startsecs=5
stopwaitsecs=10
stopsignal=TERM
killasgroup=true
stopasgroup=true
priority=10
stdout_logfile=/workspace/logs/watchdog.out.log
stderr_logfile=/workspace/logs/watchdog.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[program:token-watchdog]
; Каждые 30 минут проверяет Telegram token. SILENT MODE.
command=/workspace/.venv/bin/python /workspace/scripts/token_watchdog.py
directory=/workspace
environment=PYTHONUNBUFFERED="1",VIRTUAL_ENV="/workspace/.venv",PATH="/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
user=root
autostart=true
autorestart=true
startretries=999
startsecs=5
stopwaitsecs=10
stopsignal=TERM
killasgroup=true
stopasgroup=true
priority=10
stdout_logfile=/workspace/logs/token-watchdog.out.log
stderr_logfile=/workspace/logs/token-watchdog.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[program:db-backup]
; Ежедневный backup БД. SILENT MODE.
command=/workspace/.venv/bin/python /workspace/scripts/db_backup_daemon.py
directory=/workspace
environment=PYTHONUNBUFFERED="1",VIRTUAL_ENV="/workspace/.venv",PATH="/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
user=root
autostart=true
autorestart=true
startretries=999
startsecs=5
stopwaitsecs=10
stopsignal=TERM
killasgroup=true
stopasgroup=true
priority=10
stdout_logfile=/workspace/logs/db-backup.out.log
stderr_logfile=/workspace/logs/db-backup.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[program:cleanup]
; Еженедельная очистка. SILENT MODE.
command=/workspace/.venv/bin/python /workspace/scripts/cleanup_daemon.py
directory=/workspace
environment=PYTHONUNBUFFERED="1",VIRTUAL_ENV="/workspace/.venv",PATH="/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
user=root
autostart=true
autorestart=true
startretries=999
startsecs=5
stopwaitsecs=10
stopsignal=TERM
killasgroup=true
stopasgroup=true
priority=10
stdout_logfile=/workspace/logs/cleanup.out.log
stderr_logfile=/workspace/logs/cleanup.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[group:arb]
programs=api,bot,watchdog,token-watchdog,db-backup,cleanup
priority=999
